services:
  # 1. Base de donnees MySQL
  db:
    image: mysql:8.0
    container_name: todo-sys-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todo_db
      MYSQL_USER: testUsername
      MYSQL_PASSWORD: testpasword
    ports:
      - "13301:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Backend Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: todo-spring-app
    ports:
      - "18061:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/todo_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=testUsername
      - SPRING_DATASOURCE_PASSWORD=testpasword
    depends_on:
      db:
        condition: service_healthy

  # 3. Frontend Angular / Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: todo-angular-app
    ports:
      - "18019:80"
    depends_on:
      - app

volumes:
  db_data: